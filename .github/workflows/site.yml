# Publishes the documentation and the gallery to GitHub Pages (tools/site.py) on every push to main, and again after the
# gallery workflow commits new renders (its push comes from the workflow token, which does not trigger push workflows).
name: site

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [gallery]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: pip install markdown
      - run: python tools/site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
