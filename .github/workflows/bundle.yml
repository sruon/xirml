# Makes the release bundles: the newest plugin DLL from xirml-core's build plus this repository's ui/ and data/, laid out
# like the Ashita folder, one zip per Ashita interface version the core build targets.
# Runs on every push here, when xirml-core finishes a build on main (repository_dispatch "core-built"), and by hand.
# Needs the secret CORE_TOKEN: a token that can read xirml-core's Actions artifacts (Actions: read while that repository
# is private; github.token cannot reach another repository).
# Every build of main replaces the "latest" prerelease with its zips. A push of a v* tag publishes them as a versioned release.
name: bundle

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  repository_dispatch:
    types: [core-built]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bundle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.CORE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Plugin from xirml-core
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::error::the secret CORE_TOKEN is not set; it needs Actions read on sruon/xirml-core"; exit 1; }
          run='${{ github.event.client_payload.run_id }}'
          if [ -z "$run" ]; then
            run=$(gh run list -R sruon/xirml-core -w build -b main -s success -L 1 --json databaseId -q '.[0].databaseId')
          fi
          echo "xirml-core build run $run"
          gh run download "$run" -R sruon/xirml-core -D core
          ls core

      - name: Bundles
        id: bundles
        run: |
          label='${{ github.ref_type == 'tag' && github.ref_name || '' }}'
          [ -n "$label" ] || label=$(git rev-parse --short HEAD)
          mkdir out
          for dir in core/xirml-ashita-*; do
            interface=$(basename "$dir" | cut -d- -f3)
            cp -r ui data "$dir/config/xirml/"
            cp LICENSE "$dir/licenses/xirml.txt"
            (cd "$dir" && zip -qr "../../out/xirml-$label-ashita-$interface.zip" .)
          done
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: xirml-bundles-${{ github.sha }}
          path: out
          if-no-files-found: error

      - name: Latest
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest out/*.zip --prerelease --target "$GITHUB_SHA" --title "Latest build" --notes "The newest xirml-core build of main with this repository's ui/ and data/ at $(git rev-parse --short HEAD). Replaced by every new build. Versioned releases are tagged v*."

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' out/*.zip --title '${{ github.ref_name }}' --generate-notes
