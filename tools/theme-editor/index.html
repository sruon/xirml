<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>xirml theme editor</title>
<style>
:root { color-scheme: dark; --bg: #14161b; --panel: #1c1f26; --line: #2c313b; --ink: #e9e6df; --dim: #979ba6; --accent: #e8c98a; --bad: #ff9c7a; }
* { box-sizing: border-box; }
body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, "Segoe UI", sans-serif; }
code, input[type=text], pre { font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
input[type=text], input[type=search], select, button { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; font-size: 13px; }
button { cursor: pointer; }
button:hover, select:hover { border-color: var(--dim); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
[hidden] { display: none !important; }

header { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
header h1 { font-size: 15px; margin: 0 8px 0 0; color: var(--accent); font-weight: 600; }
#about { color: var(--dim); flex: 1 1 200px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#status { color: var(--dim); }
#status.bad, .bad { color: var(--bad); }

main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(440px, 600px) minmax(0, 1fr); }
#left { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); }
#left > .bar, #right > .bar { display: flex; gap: 8px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--line); }
#filter { flex: 1; }
#tokens { overflow-y: auto; padding: 0 16px 24px; }
#tokens h2 { position: sticky; top: 0; background: var(--bg); margin: 0; padding: 14px 0 6px; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--dim); border-bottom: 1px solid var(--line); z-index: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) 28px 180px 62px 50px; gap: 2px 8px; align-items: center; padding: 5px 0; border-bottom: 1px solid #ffffff0a; }
.row .id { min-width: 0; }
.row .id code { color: var(--ink); }
.row .id small { display: block; color: var(--dim); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row input[type=color] { width: 28px; height: 24px; padding: 0; border: 1px solid var(--line); border-radius: 4px; background: none; cursor: pointer; }
.row input[type=text] { width: 100%; }
.row .src { font-size: 11.5px; color: var(--dim); text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row.own .src { color: var(--accent); }
.row.own .id code { color: var(--accent); }
.row .reset { padding: 2px 6px; font-size: 11.5px; visibility: hidden; }
.row.own .reset { visibility: visible; }
.row .res { grid-column: 3 / -1; font-size: 11.5px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: ui-monospace, Consolas, monospace; }

#right { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
#stage { flex: 1; min-height: 0; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
#shot { max-width: 100%; max-height: 100%; object-fit: contain; border: 1px solid var(--line); }
#shot.stale { opacity: .45; }
#perr { margin: 0; padding: 10px 12px; background: #2a1a17; border: 1px solid #6b3a2e; border-radius: 4px; color: var(--bad); white-space: pre-wrap; max-width: 100%; }
#pmsg { margin: 0; color: var(--dim); }
.spinner { width: 16px; height: 16px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

dialog { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 18px; width: 380px; }
dialog::backdrop { background: #000a; }
dialog h2 { margin: 0 0 12px; font-size: 15px; }
dialog label { display: block; margin-bottom: 10px; color: var(--dim); font-size: 12px; }
dialog label input, dialog label select { display: block; width: 100%; margin-top: 3px; background: var(--bg); }
dialog .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }

@media (max-width: 900px) { body { height: auto; } main { grid-template-columns: 1fr; } #tokens { max-height: 60vh; } }
</style>
</head>
<body>
<header>
  <h1>xirml theme editor</h1>
  <label>Theme <select id="theme"></select></label>
  <button id="create">New theme…</button>
  <span id="about"></span>
  <span id="status" role="status" aria-live="polite"></span>
</header>
<main>
  <section id="left">
    <div class="bar"><input id="filter" type="search" placeholder="Filter tokens by name or value" aria-label="Filter tokens"></div>
    <div id="tokens"></div>
  </section>
  <section id="right">
    <div class="bar">
      <label>Panel <select id="panel"></select></label>
      <label><input id="full" type="checkbox"> whole scene</label>
      <button id="rerender">Render</button>
      <span id="spin" class="spinner" hidden aria-label="Rendering"></span>
    </div>
    <div id="stage">
      <p id="pmsg" hidden></p>
      <pre id="perr" hidden></pre>
      <img id="shot" alt="Preview of the selected panel" hidden>
    </div>
  </section>
</main>

<dialog id="dialog">
  <form id="form">
    <h2>New theme</h2>
    <label>Id (folder name: a-z, 0-9, - and _) <input name="id" required pattern="[a-z0-9_\-]{1,32}" maxlength="32" autocomplete="off"></label>
    <label>Name <input name="name" required maxlength="96" autocomplete="off"></label>
    <label>Description <input name="description" maxlength="1024" autocomplete="off"></label>
    <label>Extends <select name="extends"></select></label>
    <p id="formError" class="bad" hidden></p>
    <div class="actions"><button type="button" id="cancel">Cancel</button><button type="submit">Create</button></div>
  </form>
</dialog>

<script>
const $ = selector => document.querySelector(selector);
const HEX = /^#([0-9a-f]{3}|[0-9a-f]{6}|[0-9a-f]{8})$/i;
let server = { themes: [], panels: [], preview: { ok: false, message: '' } };
let theme = null;          // the loaded theme view
const rows = new Map();    // token name -> its row's elements

async function api(path, body) {
  const response = await fetch(path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {});
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || response.statusText);
  return data;
}

function status(text, bad) {
  $('#status').textContent = text;
  $('#status').classList.toggle('bad', !!bad);
}

function remember(key, value) {
  try { if (value === undefined) return localStorage.getItem(key); localStorage.setItem(key, value); } catch { return null; }
}

// '#rgb', '#rrggbb' or '#rrggbbaa' -> ['#rrggbb', 'aa' or ''], which is what a colour input can hold and what it cannot
function splitColour(value) {
  if (!HEX.test(value)) return null;
  let hex = value.slice(1).toLowerCase();
  if (hex.length === 3) hex = [...hex].map(digit => digit + digit).join('');
  return ['#' + hex.slice(0, 6), hex.slice(6)];
}

function option(value, label) {
  const element = document.createElement('option');
  element.value = value;
  element.textContent = label ?? value;
  return element;
}

async function loadThemes(select) {
  server = await api('/api/themes');
  const wanted = select || $('#theme').value || remember('theme');
  $('#theme').replaceChildren(...server.themes.map(entry => option(entry.id, `${entry.name} (${entry.id})`)));
  if (server.themes.some(entry => entry.id === wanted)) $('#theme').value = wanted;
  if (!$('#panel').options.length) {
    $('#panel').replaceChildren(...server.panels.map(id => option(id)), option('?', 'other…'));
    const panel = remember('panel');
    if (panel && !server.panels.includes(panel)) $('#panel').prepend(option(panel));
    if (panel) $('#panel').value = panel;
  }
  $('#pmsg').hidden = server.preview.ok;
  $('#pmsg').textContent = server.preview.ok ? '' : `Preview unavailable. ${server.preview.message} Editing still works.`;
  $('#rerender').disabled = !server.preview.ok;
  await loadTheme();
}

async function loadTheme() {
  const id = $('#theme').value;
  if (!id) return;
  remember('theme', id);
  try {
    paint(await api('/api/theme?id=' + encodeURIComponent(id)), true);
    status('');
  } catch (error) {
    theme = null;
    rows.clear();
    $('#tokens').replaceChildren();
    $('#about').textContent = '';
    status(error.message, true);
  }
  queueRender(0);
}

function paint(view, rebuild) {
  theme = view;
  const names = view.groups.flatMap(group => group.tokens.map(token => token.name));
  $('#about').textContent = [view.description, 'base → ' + view.chain.join(' → '), view.error].filter(Boolean).join(' · ');
  $('#about').title = $('#about').textContent;
  if (rebuild || names.length !== rows.size || names.some(name => !rows.has(name))) {
    rows.clear();
    $('#tokens').replaceChildren(...view.groups.map(group => {
      const section = document.createElement('section');
      const heading = document.createElement('h2');
      heading.textContent = heading.title = group.title;
      section.append(heading, ...group.tokens.map(buildRow));
      return section;
    }));
  }
  for (const group of view.groups) group.tokens.forEach(patchRow);
  applyFilter();
}

function buildRow(token) {
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = '<div class="id"><code></code><small></small></div><input type="color"><input type="text" spellcheck="false" autocomplete="off">' +
    '<span class="src"></span><button class="reset" title="Back to the value this theme last committed, or the inherited value if it never had one">reset</button><div class="res"></div>';
  const [id, colour, text, source, reset, resolved] = row.children;
  id.firstChild.textContent = '$' + token.name;
  id.lastChild.textContent = id.lastChild.title = token.comment;
  colour.setAttribute('aria-label', `--${token.name} colour`);
  text.setAttribute('aria-label', `--${token.name} value`);
  reset.setAttribute('aria-label', `Reset --${token.name}`);

  let timer;
  colour.addEventListener('input', () => {
    // the picker has no alpha: keep the alpha the value already had
    text.value = colour.value + (splitColour(rows.get(token.name).token.value)?.[1] ?? '');
    clearTimeout(timer);
    timer = setTimeout(() => save(token.name, text.value), 250);
  });
  text.addEventListener('change', () => {
    const value = text.value.trim();
    if (value) save(token.name, value); else text.value = rows.get(token.name).token.raw;
  });
  reset.addEventListener('click', () => save(token.name, null));
  rows.set(token.name, { row, colour, text, source, resolved, token });
  return row;
}

function patchRow(token) {
  const entry = rows.get(token.name);
  entry.token = token;
  entry.row.classList.toggle('own', token.own);
  entry.row.dataset.search = `--${token.name} ${token.raw} ${token.value} ${token.comment}`.toLowerCase();
  if (document.activeElement !== entry.text) entry.text.value = token.raw;
  const colour = splitColour(token.value);
  entry.colour.style.visibility = colour ? '' : 'hidden';
  if (colour && document.activeElement !== entry.colour) entry.colour.value = colour[0];
  entry.source.textContent = entry.source.title = token.own ? 'this theme' : token.source;
  entry.resolved.textContent = token.error || (token.raw !== token.value ? '= ' + token.value : '');
  entry.resolved.title = entry.resolved.textContent;
  entry.resolved.classList.toggle('bad', !!token.error);
  entry.resolved.hidden = !entry.resolved.textContent;
}

function applyFilter() {
  const words = $('#filter').value.toLowerCase().split(/\s+/).filter(Boolean);
  for (const section of $('#tokens').children) {
    let shown = 0;
    for (const row of section.querySelectorAll('.row')) {
      row.hidden = !words.every(word => row.dataset.search.includes(word));
      shown += !row.hidden;
    }
    section.hidden = !shown;
  }
}

async function save(name, value) {
  if (!theme) return;
  try {
    paint(await api('/api/token', { theme: theme.id, name, value }));
    status(value === null ? `--${name} reset` : `--${name} saved`);
    queueRender();
  } catch (error) {
    status(error.message, true);
  }
}

// --- preview: one render at a time, the newest request wins ---
let renderTimer, rendering = false, again = false, shotUrl;

function queueRender(delay = 400) {
  clearTimeout(renderTimer);
  renderTimer = setTimeout(render, delay);
}

async function render() {
  if (!theme || !server.preview.ok) return;
  if (rendering) { again = true; return; }
  rendering = true;
  again = false;
  $('#spin').hidden = false;
  try {
    const response = await fetch(`/api/render?theme=${encodeURIComponent(theme.id)}&panel=${encodeURIComponent($('#panel').value)}&full=${$('#full').checked ? 1 : 0}`);
    if (!response.ok) throw new Error((await response.json()).error);
    const url = URL.createObjectURL(await response.blob());
    $('#shot').src = url;
    $('#shot').hidden = false;
    $('#shot').classList.remove('stale');
    $('#perr').hidden = true;
    if (shotUrl) URL.revokeObjectURL(shotUrl);
    shotUrl = url;
  } catch (error) {
    $('#perr').textContent = error.message;
    $('#perr').hidden = false;
    $('#shot').classList.add('stale');
  } finally {
    rendering = false;
    $('#spin').hidden = true;
    if (again) render();
  }
}

$('#theme').addEventListener('change', loadTheme);
$('#filter').addEventListener('input', applyFilter);
$('#full').addEventListener('change', () => queueRender(0));
$('#rerender').addEventListener('click', () => queueRender(0));
$('#panel').addEventListener('change', event => {
  const select = event.target;
  if (select.value === '?') {
    const id = (prompt('Panel id, for example live/menuwind') || '').trim();
    if (!id) { select.value = remember('panel') || server.panels[0]; return; }
    if (![...select.options].some(entry => entry.value === id)) select.prepend(option(id));
    select.value = id;
  }
  remember('panel', select.value);
  queueRender(0);
});

$('#create').addEventListener('click', () => {
  const form = $('#form');
  form.reset();
  form.elements.extends.replaceChildren(option('', '(nothing: the base tokens)'), ...server.themes.map(entry => option(entry.id, `${entry.name} (${entry.id})`)));
  form.elements.extends.value = $('#theme').value;
  $('#formError').hidden = true;
  $('#dialog').showModal();
});
$('#cancel').addEventListener('click', () => $('#dialog').close());
$('#form').addEventListener('submit', async event => {
  event.preventDefault();
  const fields = Object.fromEntries(new FormData(event.target));
  try {
    await api('/api/theme', fields);
    $('#dialog').close();
    await loadThemes(fields.id);
    status(`ui/themes/${fields.id} created`);
  } catch (error) {
    $('#formError').textContent = error.message;
    $('#formError').hidden = false;
  }
});

loadThemes().catch(error => status(error.message, true));
</script>
</body>
</html>
